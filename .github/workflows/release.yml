name: auto-release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.check.outputs.tag }}
      old_tag: ${{ steps.check.outputs.old_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: check
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version:[[:space:]]*\([^ #]*\).*/\1/p' metadata.yaml)"
          VERSION="${VERSION#v}"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'; then
            echo "::error::metadata.yaml version is not valid SemVer"
            exit 1
          fi
          TAG="v${VERSION}"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$TAG" ]; then
            echo "::error::release tag must match metadata.yaml version ($TAG)"
            exit 1
          fi
          python3 .github/scripts/release_check.py versions

          # Find the preceding release in history, excluding this commit's tag.
          OLD_TAG="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^ 2>/dev/null || true)"
          OLD_TAG="${OLD_TAG:-none}"
          echo "Release tag: $TAG"
          echo "Previous release tag: $OLD_TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "old_tag=$OLD_TAG" >> "$GITHUB_OUTPUT"

  create-release:
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Package plugin
        run: |
          TAG="${{ needs.check-version.outputs.new_tag }}"
          mkdir -p dist
          # .gitattributes keeps development files out of the archive.
          git archive --format=zip -o "dist/astrbot_plugin_openai_oauth-${TAG}.zip" HEAD
          unzip -l "dist/astrbot_plugin_openai_oauth-${TAG}.zip"

      - name: Generate release notes
        id: notes
        run: |
          NEW_TAG="${{ needs.check-version.outputs.new_tag }}"
          OLD_TAG="${{ needs.check-version.outputs.old_tag }}"
          REPO="${{ github.repository }}"

          echo "## ${NEW_TAG}" > release_notes.md
          echo "" >> release_notes.md

          if [ "$OLD_TAG" != "none" ] && git rev-parse "$OLD_TAG" >/dev/null 2>&1; then
            git log --pretty=format:"%s|%h|%H" "$OLD_TAG..HEAD" --no-merges > commits.txt

            print_category() {
              title="$1"; pattern="$2"
              hits="$(grep -iE "$pattern" commits.txt || true)"
              if [ -n "$hits" ]; then
                echo "### $title" >> release_notes.md
                printf '%s\n' "$hits" | while IFS='|' read -r msg hash full; do
                  echo "- ${msg} ([${hash}](https://github.com/${REPO}/commit/${full}))" >> release_notes.md
                done
                echo "" >> release_notes.md
              fi
            }

            print_category "Features" "^(feat|feature)(\([^)]*\))?:"
            print_category "Fixes" "^fix(\([^)]*\))?:"
            print_category "Documentation" "^docs(\([^)]*\))?:"
            print_category "Chores" "^(chore|style|refactor|perf|test|ci|build)(\([^)]*\))?:"

            rm -f commits.txt
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${OLD_TAG}...${NEW_TAG}" >> release_notes.md
          else
            echo "### Initial release" >> release_notes.md
            echo "" >> release_notes.md
            git log --pretty=format:"- %s ([%h](https://github.com/${REPO}/commit/%H))" -10 --no-merges >> release_notes.md
          fi

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.check-version.outputs.new_tag }}
          name: ${{ needs.check-version.outputs.new_tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
