name: test

on:
  pull_request:
  push:
    branches:
      - main
  # Catch AstrBot releases that change internals the plugin relies on.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python3.12 -m pip install --disable-pip-version-check "uv==0.9.9"

      - name: Install plugin lint dependencies
        run: uv sync --frozen

      - name: Lint plugin
        run: |
          uv run ruff format --check .
          uv run ruff check .

      - name: Run framework-free tests
        run: uv run python tests/run_unit_tests.py

      - name: Type-check core modules
        run: uv run mypy

      - name: Check version references
        run: python3.12 .github/scripts/release_check.py versions

      - name: Run Plugin Views regressions
        run: node tests/view_test.mjs

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pushes and pull requests test the declared minimum and the newest
        # verified release; the weekly run tests whatever AstrBot released last.
        astrbot: ${{ fromJSON(github.event_name == 'schedule' && '["latest"]' || '["v4.27.1", "v4.29.4"]') }}
    name: integration (AstrBot ${{ matrix.astrbot }})
    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: astrbot_plugin_openai_oauth

      - name: Resolve AstrBot release
        id: astrbot
        run: |
          REF="${{ matrix.astrbot }}"
          if [ "$REF" = "latest" ]; then
            REF="$(git ls-remote --tags --refs https://github.com/AstrBotDevs/AstrBot.git 'v*' \
              | sed 's#.*refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)"
          fi
          echo "Testing against AstrBot $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Checkout AstrBot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AstrBotDevs/AstrBot
          ref: ${{ steps.astrbot.outputs.ref }}
          path: AstrBot

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python3.12 -m pip install --disable-pip-version-check "uv==0.9.9"

      - name: Install AstrBot test environment
        working-directory: AstrBot
        run: uv sync

      - name: Run plugin integration regressions
        run: |
          mkdir -p "$GITHUB_WORKSPACE/AstrBot/data/plugins"
          "$GITHUB_WORKSPACE/AstrBot/.venv/bin/python" \
            "$GITHUB_WORKSPACE/astrbot_plugin_openai_oauth/tests/run_tests.py"

  codex-release:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Fetch latest stable Codex release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/openai/codex/releases/latest > "$RUNNER_TEMP/codex-release.json"

      - name: Check built-in Codex version
        run: python3.12 .github/scripts/check_codex_release.py "$RUNNER_TEMP/codex-release.json"
