<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="256" height="256">
  <!-- OAuth 2.0 互扣双环 mark（Apache-2.0 社区标识）。用 mask/clip 实现链式互扣：
       右环位于左环圆内的部分先画（被左环盖住），左环完整画，右环在左环圆外的部分最后画。 -->
  <defs>
    <clipPath id="leftCircle">
      <circle cx="52" cy="60" r="32"/>
    </clipPath>
    <mask id="outsideLeft">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="52" cy="60" r="32" fill="#000"/>
    </mask>
  </defs>
  <!-- 右环在左环圆内的部分（后景） -->
  <circle cx="76" cy="60" r="32" fill="none" stroke="#3b82f6" stroke-width="14" clip-path="url(#leftCircle)"/>
  <!-- 左环（完整，盖住右环内侧） -->
  <circle cx="52" cy="60" r="32" fill="none" stroke="#3b82f6" stroke-width="14"/>
  <!-- 右环在左环圆外的部分（前景，压住左环） -->
  <circle cx="76" cy="60" r="32" fill="none" stroke="#3b82f6" stroke-width="14" mask="url(#outsideLeft)"/>
</svg>
