<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenAI 订阅登录 (Codex)</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 620px; margin: 32px auto; padding: 0 16px; line-height: 1.6; }
  h1 { font-size: 20px; }
  button { font-size: 14px; padding: 8px 16px; border: none; border-radius: 8px; background: #10a37f; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  code, textarea { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #steps { margin-top: 16px; }
  #steps p { margin: 8px 0; }
  .code { font-size: 18px; font-weight: 600; background: #f0f0f0; padding: 2px 8px; border-radius: 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #url { word-break: break-all; color: #10a37f; }
  #status { margin-top: 12px; color: #666; }
  #error { margin-top: 12px; color: #c00; white-space: pre-wrap; }
  .ok { color: #0a7a3d; }
</style>
</head>
<body>
  <h1>OpenAI 订阅登录 (Codex OAuth)</h1>
  <p>用你的 ChatGPT 账号授权，登录成功后凭据会自动写入模型配置，无需复制粘贴。</p>
  <button id="start">开始登录</button>
  <div id="steps" hidden>
    <p>1. 复制下面的链接，在浏览器新标签页打开：</p>
    <div class="row">
      <code id="url"></code>
      <button id="copy-url">复制链接</button>
    </div>
    <p>2. 在打开的页面输入设备码：</p>
    <div class="row">
      <span class="code" id="code"></span>
      <button id="copy-code">复制设备码</button>
    </div>
  </div>
  <div id="status"></div>
  <div id="result" hidden>
    <p class="ok" id="result-text">登录成功，凭据已写入模型配置。</p>
  </div>
  <div id="error" hidden></div>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const startBtn = $("start");
    let polling = null;

    function setStatus(text) {
      $("status").textContent = text;
      $("error").hidden = true;
    }
    function showError(text) {
      $("status").textContent = "";
      $("error").hidden = false;
      $("error").textContent = text;
      startBtn.disabled = false;
    }
    async function copyText(text, btn) {
      let ok = false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          ok = true;
        }
      } catch (e) { /* 走 fallback */ }
      if (!ok) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        ok = document.execCommand("copy");
        ta.remove();
      }
      if (ok) { btn.textContent = "已复制"; setTimeout(() => { btn.textContent = "复制"; }, 1500); }
    }

    const bridge = window.AstrBotPluginPage;
    if (!bridge || typeof bridge.apiPost !== "function") {
      showError("插件页面桥接不可用，请确认 AstrBot 版本支持插件页面。");
      startBtn.disabled = true;
    }

    startBtn.addEventListener("click", async () => {
      if (!bridge) return;
      startBtn.disabled = true;
      $("result").hidden = true;
      try {
        const data = await bridge.apiPost("device/start", {});
        $("steps").hidden = false;
        $("url").textContent = data.verify_url;
        $("code").textContent = data.user_code;
        $("copy-url").onclick = () => copyText(data.verify_url, $("copy-url"));
        $("copy-code").onclick = () => copyText(data.user_code, $("copy-code"));
        setStatus("等待授权：请在打开的页面输入设备码完成登录……");
        poll(data.session_id, Math.max(2, Number(data.interval) || 5));
      } catch (e) {
        showError(String(e && e.message ? e.message : e));
      }
    });

    function poll(sessionId, interval) {
      if (polling) clearInterval(polling);
      polling = setInterval(async () => {
        try {
          const data = await bridge.apiPost("device/poll", { session_id: sessionId });
          if (data.status === "success") {
            clearInterval(polling);
            await saveCreds(data.creds);
          } else if (data.status === "error" || data.status === "timeout") {
            clearInterval(polling);
            showError(data.error || "登录失败");
          }
        } catch (e) { /* 瞬时错误继续轮询 */ }
      }, interval * 1000);
    }

    async function saveCreds(creds) {
      try {
        const res = await bridge.apiPost("save_creds", { creds: creds });
        $("result").hidden = false;
        $("result-text").textContent = res && res.message
          ? "登录成功：" + res.message + "。回到模型配置即可使用。"
          : "登录成功，凭据已写入模型配置。回到模型配置即可使用。";
        setStatus("登录成功。");
      } catch (e) {
        $("result").hidden = false;
        $("result-text").textContent = "登录成功，但自动写入凭据失败：" + (e && e.message || e) + "。请回到模型配置手动粘贴 key。";
        setStatus("登录成功（未写入配置）。");
      }
    }
  </script>
</body>
</html>
