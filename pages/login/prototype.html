<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Providers</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./prototype.js"></script>
  </head>
  <body>
    <main class="account-center">
      <header class="page-heading">
        <h1 id="title">Providers</h1>
        <span id="updated" class="updated" role="status"></span>
        <button id="usage" class="icon-button" type="button" aria-label="刷新状态">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" />
            <path d="M20 4v5h-5" />
          </svg>
        </button>
        <button id="add-provider" class="button primary" type="button">新增 Provider</button>
      </header>
      <p id="provider-help" class="muted"></p>
      <p id="page-error" class="error" role="alert" hidden></p>
      <nav id="providers" class="provider-list" aria-label="Providers"></nav>

      <section id="provider-detail" class="panel" aria-labelledby="source-name" hidden>
        <div id="account-view">
          <div class="panel-section">
            <div class="account-row">
              <div class="source-icon" aria-hidden="true">
                <span id="icon-local">
                  <svg viewBox="0 0 24 24">
                    <rect x="3" y="4.5" width="18" height="15" rx="2.5" />
                    <path d="M7.5 9.5l2.5 2.5-2.5 2.5M12.5 14.5h4" />
                  </svg>
                </span>
                <span id="icon-plugin" hidden>
                  <svg viewBox="0 0 24 24">
                    <circle cx="8" cy="15" r="4" />
                    <path d="M10.9 12.1L19.5 3.5M16 7l2.5 2.5" />
                  </svg>
                </span>
              </div>
              <div class="account-copy">
                <h2>
                  <span id="source-name">—</span>
                  <span id="plan" class="plan-tag" hidden></span>
                </h2>
                <p id="source-caption"></p>
              </div>
              <span id="account-status" class="badge neutral">…</span>
            </div>
            <div class="quota-list" aria-live="polite">
              <div id="usage-result" class="quota-cards"></div>
              <p id="quota-policy" class="quota-placeholder" hidden></p>
            </div>
            <p id="notice" class="notice" role="status" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 9v4M12 17h.01" />
                <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" />
              </svg>
              <span id="notice-text"></span>
            </p>
          </div>
          <div class="panel-section provider-actions">
            <label id="rename-label" for="provider-name">名称</label>
            <input id="provider-name" type="text" maxlength="80" />
            <button id="rename-provider" class="button" type="button">保存名称</button>
            <button id="open-login" class="button" type="button">重新登录</button>
            <button id="delete-provider" class="button quiet" type="button">删除</button>
          </div>
        </div>
      </section>

      <p class="footnote">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4.5" y="11" width="15" height="10" rx="2" />
          <path d="M8 11V7.5a4 4 0 0 1 8 0V11" />
        </svg>
        <span id="privacy"></span>
      </p>
    </main>

    <dialog id="login-dialog" aria-labelledby="instructions-title">
      <div class="dialog-heading">
        <h2 id="instructions-title">设备码登录</h2>
        <button id="close-login" class="icon-button" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
          </svg>
        </button>
      </div>
      <div class="dialog-body">
        <p id="login-intro" class="dialog-intro"></p>
        <label id="login-name-label" for="login-name">Provider 名称</label>
        <input id="login-name" type="text" maxlength="80" value="ChatGPT" />
        <ol id="instructions" class="steps" hidden>
          <li>
            <label id="open-label" for="verify-url"></label>
            <div class="copy-row">
              <input id="verify-url" type="text" readonly />
              <button id="copy-url" class="button small" type="button"></button>
            </div>
          </li>
          <li>
            <label id="code-label" for="user-code"></label>
            <div class="copy-row code-row">
              <input id="user-code" class="device-code" type="text" readonly />
              <button id="copy-code" class="button small" type="button"></button>
            </div>
          </li>
          <li>
            <span id="confirm-label" class="step-label"></span>
          </li>
        </ol>
        <p class="login-status">
          <span id="status" role="status"></span>
          <span id="status-dots" class="quiet-dots" aria-hidden="true" hidden><i></i><i></i><i></i></span>
        </p>
        <p id="copy-status" class="copy-status" role="status"></p>
        <p id="error" class="error" role="alert" hidden></p>
      </div>
      <div class="actions">
        <button id="cancel" class="button quiet" type="button" hidden></button>
        <button id="start" class="button primary" type="button" autofocus></button>
      </div>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
