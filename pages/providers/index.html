<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Providers</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="/api/plugin/page/bridge-sdk.js"></script>
  </head>
  <body>
    <main class="account-center">
      <header class="page-heading">
        <div class="heading-copy">
          <h1 id="title">Providers</h1>
        </div>
        <span id="updated" class="updated" role="status"></span>
        <button id="usage" class="icon-button" type="button" aria-label="刷新状态">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" />
            <path d="M20 4v5h-5" />
          </svg>
        </button>
        <button id="add-provider" class="button primary with-icon" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span id="add-provider-label">新增 Provider</span>
        </button>
      </header>
      <p id="page-error" class="error" role="alert" hidden></p>
      <p id="save-error" class="error" role="alert" hidden></p>

      <!-- Rows are rendered by app.js; the allowance panel is moved under the
           selected row. Rarely used settings live in the settings dialog. -->
      <div id="providers" class="provider-list" aria-label="Providers">
        <section id="provider-detail" class="editor" aria-labelledby="source-name" hidden>
          <div class="sr-only">
            <h2 id="source-name">—</h2>
            <span id="plan" hidden></span>
            <span id="account-status"></span>
          </div>
          <div class="editor-row">
            <span id="quota-label" class="editor-label compact">额度</span>
            <div class="editor-body">
              <div class="quota-list" aria-live="polite">
                <div id="usage-result" class="quota-rows"></div>
                <p id="quota-policy" class="quota-note" hidden></p>
              </div>
              <p id="notice" class="notice" role="status" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 9v4M12 17h.01" />
                  <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" />
                </svg>
                <span id="notice-text"></span>
              </p>
            </div>
          </div>
        </section>
      </div>

      <p class="footnote">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4.5" y="11" width="15" height="10" rx="2" />
          <path d="M8 11V7.5a4 4 0 0 1 8 0V11" />
        </svg>
        <span id="privacy"></span>
      </p>
    </main>

    <dialog id="login-dialog" aria-labelledby="instructions-title">
      <div class="dialog-heading">
        <h2 id="instructions-title">新增 Provider</h2>
        <button id="close-login" class="icon-button" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
          </svg>
        </button>
      </div>
      <div class="dialog-body">
        <p id="login-intro" class="dialog-intro"></p>
        <div id="login-name-field" class="field">
          <label for="login-name">
            <span id="login-name-label">Provider 名称</span>
            <span id="login-name-optional" class="field-optional">可选</span>
          </label>
          <input id="login-name" class="text-input" type="text" maxlength="80" value="ChatGPT" placeholder="ChatGPT" autocomplete="off" />
        </div>
        <!-- Shown while a device code is waiting for authorization. -->
        <section id="device-panel" class="device-panel" aria-labelledby="code-label" hidden>
          <p id="code-label" class="device-label">设备码</p>
          <div class="copy-row code-row">
            <input id="user-code" class="device-code" type="text" readonly spellcheck="false" aria-labelledby="code-label" />
            <button id="copy-code" class="button small" type="button" aria-describedby="code-label">复制设备码</button>
          </div>
          <div id="verify-row" class="link-row">
            <input id="verify-url" type="text" readonly spellcheck="false" aria-label="授权链接" />
            <button id="copy-url" class="link-button" type="button">复制授权链接</button>
          </div>
          <p id="device-hint" class="device-hint">在浏览器中打开链接，输入设备码完成授权。</p>
          <p id="copy-status" class="copy-status" role="status"></p>
        </section>
        <div id="login-state" class="login-state" role="status">
          <span id="state-icon" class="state-icon" aria-hidden="true"></span>
          <span class="state-copy">
            <strong id="status"></strong>
            <span id="status-detail" class="state-detail"></span>
          </span>
          <span id="status-dots" class="quiet-dots" aria-hidden="true" hidden><i></i><i></i><i></i></span>
        </div>
        <div id="saved-provider" class="saved-provider" hidden>
          <span class="provider-icon" aria-hidden="true"><span class="openai-icon"></span></span>
          <span class="saved-copy">
            <strong id="saved-name" class="saved-name"></strong>
            <span id="saved-sub" class="saved-sub" hidden></span>
          </span>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
      </div>
      <div class="actions">
        <button id="cancel" class="button quiet" type="button" hidden>取消登录</button>
        <button id="start" class="button primary" type="button" autofocus>获取设备码</button>
        <button id="done" class="button primary" type="button" hidden>完成</button>
      </div>
    </dialog>
    <!-- One settings dialog serves every provider. app.js binds it to an
         explicit source ID each time it opens and keeps a draft until saved. -->
    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title" aria-describedby="settings-kicker">
      <div class="dialog-heading settings-heading">
        <span id="settings-icon" class="provider-icon" aria-hidden="true"></span>
        <div class="settings-heading-copy">
          <h2 id="settings-title">—</h2>
          <p id="settings-kicker" class="settings-kicker">Provider 设置</p>
        </div>
        <button id="close-settings" class="icon-button" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
          </svg>
        </button>
      </div>
      <div class="dialog-body settings-body">
        <div class="field">
          <label id="settings-name-label" for="settings-name">名称</label>
          <input id="settings-name" class="text-input" type="text" maxlength="80" autocomplete="off" aria-describedby="settings-name-hint" />
          <p id="settings-name-hint" class="field-hint" hidden></p>
        </div>
        <div class="field">
          <span id="settings-routing-label" class="field-label">路由</span>
          <div class="segmented" role="group" aria-labelledby="settings-routing-label">
            <button id="settings-routing-fixed" type="button" aria-pressed="true">固定 Provider</button>
            <button id="settings-routing-auto" type="button" aria-pressed="false">自动回退</button>
          </div>
          <p id="settings-routing-help" class="field-hint"></p>
        </div>
        <!-- Account actions act immediately and never save the draft above. -->
        <section id="settings-account" class="settings-section" aria-labelledby="settings-account-label">
          <h3 id="settings-account-label" class="field-label">账号</h3>
          <div class="settings-account-row">
            <span id="settings-account-text" class="settings-account-text"></span>
            <button id="settings-reauth" class="button small" type="button">重新授权</button>
          </div>
          <div id="settings-danger" class="danger-zone">
            <div class="danger-copy">
              <strong id="settings-remove-title">移除 Provider</strong>
              <span id="settings-remove-hint"></span>
            </div>
            <div class="danger-actions">
              <button id="settings-remove-keep" class="button small quiet" type="button" hidden>保留</button>
              <button id="settings-remove" class="button small danger" type="button">移除</button>
            </div>
          </div>
        </section>
        <p id="settings-error" class="error" role="alert" hidden></p>
      </div>
      <div class="actions">
        <button id="settings-cancel" class="button quiet" type="button">取消</button>
        <button id="settings-save" class="button primary" type="button">保存</button>
      </div>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
