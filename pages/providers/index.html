<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Providers</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="/api/plugin/page/bridge-sdk.js"></script>
  </head>
  <body>
    <main class="account-center">
      <header class="page-heading">
        <div class="heading-copy">
          <h1 id="title">Providers</h1>
        </div>
        <span id="updated" class="updated" role="status"></span>
        <button id="usage" class="icon-button" type="button" aria-label="刷新状态">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" />
            <path d="M20 4v5h-5" />
          </svg>
        </button>
        <button id="add-provider" class="button primary with-icon" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
          <span id="add-provider-label">新增 Provider</span>
        </button>
      </header>
      <p id="page-error" class="error" role="alert" hidden></p>
      <p id="save-error" class="error" role="alert" hidden></p>

      <!-- Rows are rendered by app.js; the detail editor is moved under the
           selected row for inline editing. -->
      <div id="providers" class="provider-list" aria-label="Providers">
        <section id="provider-detail" class="editor" aria-labelledby="source-name" hidden>
          <div class="sr-only">
            <h2 id="source-name">—</h2>
            <span id="plan" hidden></span>
            <span id="account-status"></span>
          </div>
          <div class="editor-row">
            <span id="quota-label" class="editor-label compact">额度</span>
            <div class="editor-body">
              <div class="quota-list" aria-live="polite">
                <div id="usage-result" class="quota-rows"></div>
                <p id="quota-policy" class="quota-note" hidden></p>
              </div>
              <p id="notice" class="notice" role="status" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 9v4M12 17h.01" />
                  <path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" />
                </svg>
                <span id="notice-text"></span>
              </p>
            </div>
          </div>
          <div class="editor-row">
            <label id="rename-label" class="editor-label" for="provider-name">名称</label>
            <div class="editor-body editor-inline">
              <input id="provider-name" class="text-input" type="text" maxlength="80" autocomplete="off" />
              <button id="rename-provider" class="button small" type="button">保存</button>
            </div>
          </div>
          <div class="editor-row">
            <span id="routing-label" class="editor-label">路由</span>
            <div class="editor-body">
              <div class="segmented" role="group" aria-labelledby="routing-label">
                <button id="routing-fixed" type="button" aria-pressed="true">固定 Provider</button>
                <button id="routing-auto" type="button" aria-pressed="false">自动回退</button>
              </div>
              <p id="routing-help" class="editor-note"></p>
            </div>
          </div>
          <div id="delete-row" class="editor-foot">
            <button id="open-login" class="button small" type="button">重新授权</button>
            <div class="editor-inline">
              <button id="delete-provider" class="link-button danger" type="button">移除此 Provider</button>
              <span id="delete-hint" class="editor-hint"></span>
            </div>
          </div>
        </section>
      </div>

      <p class="footnote">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="4.5" y="11" width="15" height="10" rx="2" />
          <path d="M8 11V7.5a4 4 0 0 1 8 0V11" />
        </svg>
        <span id="privacy"></span>
      </p>
    </main>

    <dialog id="login-dialog" aria-labelledby="instructions-title">
      <div class="dialog-heading">
        <h2 id="instructions-title">新增 Provider</h2>
        <button id="close-login" class="icon-button" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
          </svg>
        </button>
      </div>
      <div class="dialog-body">
        <p id="login-intro" class="dialog-intro"></p>
        <div id="login-name-field" class="field">
          <label for="login-name">
            <span id="login-name-label">Provider 名称</span>
            <span id="login-name-optional" class="field-optional">可选</span>
          </label>
          <input id="login-name" class="text-input" type="text" maxlength="80" value="ChatGPT" placeholder="ChatGPT" autocomplete="off" />
        </div>
        <!-- Shown while a device code is waiting for authorization. -->
        <section id="device-panel" class="device-panel" aria-labelledby="code-label" hidden>
          <p id="code-label" class="device-label">设备码</p>
          <div class="copy-row code-row">
            <input id="user-code" class="device-code" type="text" readonly spellcheck="false" aria-labelledby="code-label" />
            <button id="copy-code" class="button small" type="button" aria-describedby="code-label">复制</button>
          </div>
          <a id="open-verify" class="button primary block" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">
            <span id="open-verify-label">打开 OpenAI 授权页</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M14 5h5v5M19 5l-8 8" />
              <path d="M18 14v4a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h4" />
            </svg>
          </a>
          <div id="verify-row" class="link-row">
            <input id="verify-url" type="text" readonly spellcheck="false" aria-label="授权链接" />
            <button id="copy-url" class="link-button" type="button">复制链接</button>
          </div>
          <p id="copy-status" class="copy-status" role="status"></p>
        </section>
        <div id="login-state" class="login-state" role="status">
          <span id="state-icon" class="state-icon" aria-hidden="true"></span>
          <span class="state-copy">
            <strong id="status"></strong>
            <span id="status-detail" class="state-detail"></span>
          </span>
          <span id="status-dots" class="quiet-dots" aria-hidden="true" hidden><i></i><i></i><i></i></span>
        </div>
        <div id="saved-provider" class="saved-provider" hidden>
          <span class="provider-icon" aria-hidden="true"><span class="openai-icon"></span></span>
          <span class="saved-copy">
            <strong id="saved-name" class="saved-name"></strong>
            <span id="saved-sub" class="saved-sub" hidden></span>
          </span>
        </div>
        <p id="error" class="error" role="alert" hidden></p>
      </div>
      <div class="actions">
        <button id="cancel" class="button quiet" type="button" hidden>取消登录</button>
        <button id="start" class="button primary" type="button" autofocus>获取设备码</button>
        <button id="done" class="button primary" type="button" hidden>完成</button>
      </div>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
