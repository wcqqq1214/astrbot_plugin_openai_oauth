<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; }
  #card { width: min(188px, 100%); aspect-ratio: 1; background-size: cover; }
  button { display: block; max-width: 100%; padding: 0; border: 0; background: transparent; cursor: zoom-in; }
  button img { display: block; max-width: 100%; max-height: 440px; border-radius: 12px; }
  button[aria-expanded="true"] { max-height: 960px; overflow: auto; cursor: zoom-out; }
  button[aria-expanded="true"] img { max-width: none; max-height: none; }
  [role="alert"] { color: #a76b62; }
</style>
<body>
<div id="card" role="progressbar" aria-label="Loading image">
<template id="dots-art">
<svg xmlns="http://www.w3.org/2000/svg" width="188" height="188" viewBox="0 0 200 200" aria-hidden="true">
  <defs>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r=".81" fill="#fff"/>
    </pattern>
    <clipPath id="card-clip"><rect width="200" height="200" rx="17"/></clipPath>
    <mask id="field"><rect width="200" height="200" fill="url(#dots)"/></mask>
    <radialGradient id="light">
      <stop stop-color="#c1c4ca" stop-opacity=".67"/>
      <stop offset=".51" stop-color="#93969b" stop-opacity=".45"/>
      <stop offset="1" stop-color="#717479" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .wave { animation: wave 5s ease-in-out infinite alternate }
    .echo { animation: echo 3.8s ease-in-out infinite alternate }
    @keyframes wave {
      from { transform: translate(-17px, 12px) }
      to { transform: translate(18px, -22px) }
    }
    @keyframes echo {
      from { opacity: .4; transform: translate(0, 4px) }
      to { opacity: .9; transform: translate(13px, -8px) }
    }
    @media (prefers-reduced-motion: reduce) { .wave, .echo { animation: none } }
  </style>
  <g clip-path="url(#card-clip)">
    <rect width="200" height="200" fill="#292929"/>
    <g mask="url(#field)" fill="url(#light)">
      <g class="wave"><ellipse cx="116" cy="140" rx="113" ry="54" transform="rotate(-28 116 140)"/></g>
      <g class="echo"><ellipse cx="66" cy="162" rx="78" ry="34" opacity=".55"/></g>
    </g>
  </g>
</svg>
</template>
</div>
<script>
(async () => {
  const card = document.querySelector("#card");
  // Keep SVG fragment references local despite the host's asset base URL.
  const art = document.querySelector("#dots-art").innerHTML.trim();
  card.style.backgroundImage = 'url("data:image/svg+xml,' + encodeURIComponent(art) + '")';
  const context = await window.AstrBotPluginView.ready();
  try {
    const image = new Image();
    image.alt = context.pageTitle;
    image.src = context.view.id + ".png";
    await image.decode();
    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("aria-expanded", "false");
    button.onclick = () => button.setAttribute("aria-expanded",
      String(button.getAttribute("aria-expanded") !== "true"));
    button.append(image);
    card.replaceWith(button);
  } catch {
    const error = document.createElement("span");
    error.setAttribute("role", "alert");
    error.textContent = window.AstrBotPluginView.t("image_load_failed", "Image could not be loaded.");
    card.replaceWith(error);
  }
})();
</script>
</body>
</html>
